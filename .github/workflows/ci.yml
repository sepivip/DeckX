name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +1.93.0 fmt --all --check
      - name: Lint
        run: cargo +1.93.0 clippy --locked --all-targets -- -D warnings
      - name: Run automated tests
        run: cargo +1.93.0 test --locked
