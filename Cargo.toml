[package]
name = "deckx"
version = "0.7.13"
edition = "2024"
rust-version = "1.93"
description = "Desktop control app for programmable decks"
license = "MIT"
repository = "https://github.com/sepivip/DeckX"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22"
data-encoding = "2"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
font8x8 = "0.3"
hidapi = { version = "2.6.4", default-features = false, features = ["windows-native"] }
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
raw-window-handle = "0.6"
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
rfd = { version = "0.15", default-features = false }
rquickjs = { version = "0.11", features = ["loader"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
uiautomation = { version = "0.25.1", default-features = false, features = ["input", "pattern", "process"] }
ureq = "3.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
woff2-patched = "0.4"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
glutin = { version = "0.32", default-features = false, features = ["egl"] }
